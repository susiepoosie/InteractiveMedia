  <style>
        div {
            display: block;
            unicode-bidi: isolate;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: white;
            cursor: url("media/cursor_pen.png") 32 32, auto;
            color: #000;
            text-decoration: none;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            /* You can set this to whatever you wish. */
            width: 100%;
            
            /* You'll need to set a height. */
            height: 100%;
            
            /* Allows positioning relative to this container. */
            position: relative;
        }
        #folder {
            width: 100px;
            height: 100px;
        }
        .wrapper {
            position: absolute;
            width: 100vw;
            height: 94vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .draggable{
            position: absolute;
            cursor: move;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
        }
        
        #week1{
            top: 50vh;
            left: 30vh;
        }
        #week2{

        #week3{

            left: 70vh;
        }

        /* Cluster of computer GIFs */

          width: 15em;
          transform: translate(-50%, -50%);
          top: 20%;
          left: 80%;
        }
        #computer2 {
          position: absolute;
          width: 8em;
          transform: translate(-50%, -50%);
          top: 30%;
          left: 750%;
        }
        #computer3 {
          position: absolute;
          width: 5em;
          transform: translate(-50%, -50%);
          top: 15%;
          left: 85%;
        }

  </style>
</head>

<script>
        // Get all the elements with class name "draggable":
        var draggableElements = document.getElementsByClassName("draggable");
        
        // Apply dragElement function to each draggable element:
        for (var i = 0; i < draggableElements.length; i++) {
        dragElement(draggableElements[i]);
        }
        
        function dragElement(elmnt) {
        var pos1 = 0,
            pos2 = 0,
            pos3 = 0,
            pos4 = 0;
        if (elmnt.getElementsByClassName(elmnt.className)[0]) {
            elmnt.getElementsByClassName(elmnt.className)[0].onmousedown =
            dragMouseDown;
        } else {
            // move the DIV from anywhere inside the DIV:
            elmnt.onmousedown = dragMouseDown;
        }
        
        function dragMouseDown(e) {
            e = e || window.event;
            e.preventDefault();
            // get the mouse cursor position at startup:
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            // call a function whenever the cursor moves:
            document.onmousemove = elementDrag;
        }
        
        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            // calculate the new cursor position:
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            // set the element's new position:
            elmnt.style.top = elmnt.offsetTop - pos2 + "px";
            elmnt.style.left = elmnt.offsetLeft - pos1 + "px";
        }
        
        function closeDragElement() {
            // stop moving when mouse button is released:
            document.onmouseup = null;
            document.onmousemove = null;
        }
        }
</script>
