<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 1: HTML & CSS</title>
  <script language="javascript" type="text/javascript" src="js/p5.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">


  <style>
        #p5-background {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
    }

        div {
            display: block;
            unicode-bidi: isolate;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: white;
            color: #000;
            text-decoration: none;
            font-family: "Jersey 10", monospace;
        }

        h1 {
          position: absolute;
          font-size: 80px;
          transform: rotate(45);
          top: 20vh;
          left: 50vw;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            /* You can set this to whatever you wish. */
            width: 100%;
            
            /* You'll need to set a height. */
            height: 100%;
            
            /* Allows positioning relative to this container. */
            position: relative;
        }
        #folder {
            width: 100px;
            height: 100px;
        }
        .wrapper {
            position: absolute;
            width: 100vw;
            height: 94vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .draggable{
            position: absolute;
            cursor: move;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
        }

        img:hover {
          transform: scale(2);
        }
        
        #week1{
            top: 50vh;
            left: 30vh;
        }

        #week2{
            top: 50vh;
            left: 50vh;
        }
        #week3{
            top: 50vh;
            left: 70vh;
        }

        /* Cluster of computer GIFs */
        #computer1 {
          position: absolute;
          width: 30em;
          transform: translate(-50%, -50%);
          top: 70vh;
          left: 80%;
        }

  </style>
</head>
<body>
  <div id="p5-background"></div>
  <div class="content">
        <h1>WWWOT is HTML & CSS?</h1>
        <div class="wrapper">
          <div class="draggable" id="week1">
              <img id="folder" src="https://thumbs.dreamstime.com/b/pixel-art-folder-icon-business-file-organization-minimalist-yellow-projects-apps-ui-design-ideal-topics-related-to-376328755.jpg" alt="folder">
              <a href="week-1.html">Week 1</a>
          </div>
          <div class="draggable" id="week2">
              <img id="folder" src="https://thumbs.dreamstime.com/b/pixel-art-folder-icon-business-file-organization-minimalist-yellow-projects-apps-ui-design-ideal-topics-related-to-376328755.jpg" alt="black">
              <a href="week-2.html">Week 2</a>
          </div>
          <div class="draggable" id="week3">
              <img id="folder" src="https://thumbs.dreamstime.com/b/pixel-art-folder-icon-business-file-organization-minimalist-yellow-projects-apps-ui-design-ideal-topics-related-to-376328755.jpg" alt="calculator">
              <a href="week-3.html">Week 3</a>
          </div>
        </div>

        <div class="computers">
          <img id="computer1" src="https://i.pinimg.com/originals/57/18/5d/57185d2176d7cbaebdb74c00ce1b9ebf.gif" alt="">
        </div>
  </div>

<script src="js/cursor.js"></script>
<script>
    var pic;
    function preload() {
      pic = loadImage("js/pixel-mouse.png");
      }
    new p5(function(p) {
      p.setup = function() {
        let canvas = p.createCanvas(p.windowWidth, p.windowHeight);
        canvas.parent('p5-background');
        p.imageMode(CENTER, CENTER);
        pic.resize(50,50);
      };

      p.draw = function() {
        p.background("white");
        p.scale(2);
        p.image(pic, mouseX/2, mouseY/2, 50, 50);
      };

      // Resize canvas when window resizes
      p.windowResized = function() {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
      };
    });
  </script>
<script>
        // Get all the elements with class name "draggable":
        var draggableElements = document.getElementsByClassName("draggable");
        
        // Apply dragElement function to each draggable element:
        for (var i = 0; i < draggableElements.length; i++) {
        dragElement(draggableElements[i]);
        }
        
        function dragElement(elmnt) {
        var pos1 = 0,
            pos2 = 0,
            pos3 = 0,
            pos4 = 0;
        if (elmnt.getElementsByClassName(elmnt.className)[0]) {
            elmnt.getElementsByClassName(elmnt.className)[0].onmousedown =
            dragMouseDown;
        } else {
            // move the DIV from anywhere inside the DIV:
            elmnt.onmousedown = dragMouseDown;
        }
        
        function dragMouseDown(e) {
            e = e || window.event;
            e.preventDefault();
            // get the mouse cursor position at startup:
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            // call a function whenever the cursor moves:
            document.onmousemove = elementDrag;
        }
        
        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            // calculate the new cursor position:
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            // set the element's new position:
            elmnt.style.top = elmnt.offsetTop - pos2 + "px";
            elmnt.style.left = elmnt.offsetLeft - pos1 + "px";
        }
        
        function closeDragElement() {
            // stop moving when mouse button is released:
            document.onmouseup = null;
            document.onmousemove = null;
        }
        }
</script>
</body>
</html>
