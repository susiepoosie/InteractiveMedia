  <style>
    *{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Courier New', Courier, monospace;
    font-style: normal;
}

*{
    cursor:url(), auto;
}

/* tabs */
#tabs{
    width: 100vw;
    margin: 0 auto;
    display: flex;
    justify-content: left;
    font-size: 2vh;
    }


/* Draggable cursors */
#mov-a{
    position: absolute;
    cursor: move;
}

#mov-b{
    cursor: move;
    position: absolute;
}

#mov-c{
    cursor: move;
    position: absolute;
}

.draggable{
    position: absolute;
    width: 100vw;
    height: 94vh;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#IMfolder{
    width: 5em;
    height: auto;
    cursor: move;
}

.firstTab {
    display: flex;
    width: 22.5em;
    height: auto;
    border: .1em solid rgba(109, 106, 106, 0.609);
    background-color: gainsboro;
    top: 0%;
    left: 0%;
    transform: translate(0%, 0%);
    padding: .2em;
    justify-content:space-between;
    align-items: center;
}

#foldertype{
    font-size: .7em;
    cursor: move;
}

  </style>
