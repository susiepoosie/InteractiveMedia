<!DOCTYPE html>
<html>
<head>
    <title>Susan's bag</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
    
    <style>
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        body {
            background-color: black;
            position: relative;
            font-family: "Share Tech Mono";
            font-weight: 400;
            font-style: normal;
            font-size: small;
        }

        .center {
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
    <div class="center">
        <div>
            <h1>oh, you found Susan's bag.</h1>
            <h2>can't hurt to take a peek...</h2>
        </div>  
        <div></div>      
    </div>

    <script>
        let offscreen;
        let bagImg;

        function preload() {
        bagImg = loadImage('media/backpack.png');
        }

        function setup() {
        let cnv = createCanvas(windowWidth, windowHeight);
        cnv.style('position', 'fixed');
        cnv.style('top', '0');
        cnv.style('left', '0');
        offscreen = createGraphics(windowWidth, windowHeight);
        }

        function draw() {
        let mx = mouseX;
        let my = mouseY;

        clear();

        // Draw the backpack image onto the main canvas first
        let imgH = windowHeight * 0.4;
        let imgW = bagImg.width * (imgH / bagImg.height);
        image(bagImg, windowWidth / 2 - imgW / 2, windowHeight / 2 - imgH / 2, imgW, imgH);

        // Then draw the darkness mask on top
        offscreen.clear();
        let ctx = offscreen.drawingContext;
        offscreen.background(0, 0, 0, 255);

        let grad = ctx.createRadialGradient(mx, my, 0, mx, my, 300);
        grad.addColorStop(0,    'rgba(0,0,0,0)');
        grad.addColorStop(0.45, 'rgba(0,0,0,0)');
        grad.addColorStop(1,    'rgba(0,0,0,1)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        let warmGrad = ctx.createRadialGradient(mx, my, 0, mx, my, 300);
        warmGrad.addColorStop(0,    'rgba(255,220,100,0.22)');
        warmGrad.addColorStop(0.35, 'rgba(255,160,40,0.10)');
        warmGrad.addColorStop(0.65, 'rgba(180,80,10,0.04)');
        warmGrad.addColorStop(1,    'rgba(0,0,0,0)');
        ctx.fillStyle = warmGrad;
        ctx.fillRect(0, 0, width, height);

        image(offscreen, 0, 0);
        }

        function mousePressed() {
        // check if click is roughly over the image
        let imgH = windowHeight * 0.4;
        let imgW = bagImg.width * (imgH / bagImg.height);
        let x = windowWidth / 2 - imgW / 2;
        let y = windowHeight / 2 - imgH / 2;
        if (mouseX > x && mouseX < x + imgW && mouseY > y && mouseY < y + imgH) {
            window.location.href = 'backpack.html';
            }
        }
    </script>
</body>
</html>
