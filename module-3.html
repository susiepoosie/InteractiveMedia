<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 3: Physical Computing</title>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
  <style>
    @media (max-width: 1960px) {
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw;height: 100%; display: flex; }
 
    body { background-color: rgb(255, 97, 155); }
    
    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3em 8em;
      flex-shrink: 0;
    }
 
    .banner {
      width: 100%;
      background-color: rgb(122, 140, 131);
      border: 2px solid black;
      border-radius: 20px;
      font-family: "Bitcount Single", monospace;
      font-size: 5em;
      font-weight: 300;
      display: flex;
      justify-content: center;
      align-items: center;
      color: black;
    }

    .gallery-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #000;
      overflow: none;
    }
 
    .gallery-label {
      padding: 8px 12px;
      border-bottom: 1px solid #000;
      flex-shrink: 0;
    }
 
    .gallery-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
 
    .gallery-img {
      width: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery { display: none; flex-direction: column; gap: 8px; }
    .gallery.active { display: flex; }
 
    .tile {
      width: 100%;
      background: #ddd;
    }
 
    .fade-enter { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
 
    .keypad-pane {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
    }
 
    .keypad-display {
      border: 1px solid #000;
      padding: 8px 10px;
      text-align: right;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 6px;
    }
 
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      flex: 1;
    }
 
    button {
      border: 1px solid #000;
      background: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      user-select: none;
    }
 
    button:hover { background: #ffd2e6; }
 
    button.active {
      background: #000;
      color: rgb(255, 97, 155);
    }
 
    .key-clear {
      grid-column: span 2;
      aspect-ratio: auto;
      padding: 8px 0;

    }
 
    .key-dot { 
      grid-column: span 1;
      color: rgb(255, 97, 155); 
    }

    #staticgif {
      position: absolute;
      width: 15em;
      transform: translate(-50%, -50%);
      top: 70%;
      left: 10%;
    }

    @media (max-width: 600px) {
      body {
        flex-direction: column;
      }
 
      .gallery-pane {
        flex: 1;
        border-right: none;
        border-bottom: 1px solid #000;
        min-height: 0;
      }
 
      .header {
        padding: 1em 2em;
      }
 
      .keypad-pane {
        width: 100%;
        height: 280px;
        flex-shrink: 0;
        flex-direction: row;
        padding: 10px;
        gap: 8px;
      }
 
      .keypad-display {
        width: 60px;
        flex-shrink: 0;
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
        writing-mode: vertical-rl;
      }
 
      .keypad-grid {
        flex: 1;
        grid-template-rows: repeat(4, 1fr);
        grid-template-columns: repeat(3, 1fr);
        grid-auto-flow: row;
      }
 
      button { font-size: 1rem; }
    }

  </style>
</head>
<body>

  <div class="keypad-pane">
    <div class="keypad-display">
      <small>gallery</small>

    </div>
    <div class="keypad-grid">

    <img id="staticgif" src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyYm9rd2x0ZzB1ZWx1ZmdveXY2Z240ZnZ5bGhlZzViZHJmYndpOTdlZSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/26tOYHUgZYoj2YKPe/200w.gif" alt="">
  </div>

  <script>
    function switchTo(n) {
      document.querySelector('.gallery.active').classList.remove('active');
      document.querySelector('[data-gallery="' + n + '"]').classList.add('active');
      document.querySelector('.keypad-grid button.active').classList.remove('active');
      document.querySelectorAll('.keypad-grid button')[([7,8,9,4,5,6,1,2,3]).indexOf(n)].classList.add('active');
      const label = document.querySelector('[data-gallery="' + n + '"]').dataset.label;
      document.getElementById('gallery-label').innerHTML = '<b>Gallery ' + n + '</b> — ' + label;
      document.getElementById('display-num').textContent = n;
      document.querySelector('.gallery-scroll').scrollTop = 0;
    }
  </script>
