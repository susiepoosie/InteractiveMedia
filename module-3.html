<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 3: Physical Computing</title>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }

    body {
      display: flex;
      flex-direction: column;
      background-color: black;
      font-family: "Quantico", sans-serif;
      font-weight: 400;
      font-style: normal;
      color: white;
    }

    /* ── Header banner ── */
    .header {
      display: flex;
      background-color: rgb(255, 97, 155);
      justify-content: center;
      align-items: center;
      padding: 1em 3em;
      flex-shrink: 0;
      border-bottom: 1px solid white;
    }

    .banner {
      width: 100%;
      background-color: rgb(122, 140, 131);
      border: 2px solid black;
      border-radius: 20px;
      font-family: "Bitcount Single", monospace;
      font-size: clamp(1.2rem, 3vw, 3.5em);
      font-weight: 300;
      display: flex;
      justify-content: center;
      align-items: center;
      color: black;
    }

    /* ── Main content row ── */
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── Left: calculator panel ── */
    .keypad-pane {
      background-color: rgb(255, 97, 155);
      width: 220px;
      min-width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
      border-right: 1px solid white;
      height: 100%;
      overflow: hidden;
    }

    .keypad-display {
      border: 1px solid #000;
      border-radius: 15px;
      background-color: rgb(122, 140, 131);
      font-family: "Bitcount Single", monospace;
      padding: 8px 10px;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 6px;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: min-content;
      gap: 5px;
      align-content: start;
    }

    button {
      border: 1px solid #000;
      border-radius: 20px;
      background: #fff;
      font-family: "Bitcount Single", monospace;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      user-select: none;
      min-width: 0;
      min-height: 0;
    }

    button:hover { background: #ffe8f3; }
    button.active { background: #000; color: rgb(255, 97, 155); }

    .key-clear { grid-column: span 2; aspect-ratio: auto; padding: 8px 0; }
    .key-dot   { aspect-ratio: auto; padding: 8px 0; color: rgb(255, 97, 155); width: 100%; }
    .keypad-grid a { display: contents; }

    /* ── Right: gallery panel ── */
    .gallery-pane {
      flex: 1 1 0;
      min-width: 0;
      max-width: calc(100% - 220px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .gallery-label {
      font-family: "Quantico", sans-serif;
      font-weight: 700;
      font-style: italic;
      padding: 8px 12px;
      border-bottom: 1px solid white;
      flex-shrink: 0;
    }

    .gallery-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* each named gallery is hidden until active */
    .gallery { display: none; }
    .gallery.active { display: grid; }

    .gallery {
      grid-template-columns: repeat(auto-fill, 500px);
      gap: 8px;
    }

    /* ── Grid tile ── */
    .tile {
      width: 500px;
      height: 500px;
      background: #ddd;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .tile:hover { transform: scale(1.07); z-index: 1; }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* placeholder colour shown when no img yet */
    .tile-placeholder {
      width: 100%;
      height: 100%;
      background: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #888;
      letter-spacing: 0.05em;
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      display: block;
    }

    #lightbox-caption {
      color: #fff;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    /* ── GIF overlay ── */
    #staticgif {
      position: absolute;
      width: 220px;
      bottom: 0%;
      left: 0%;
      cursor: crosshair;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .main { flex-direction: column-reverse; }

      .keypad-pane {
        width: 100%;
        height: 260px;
        flex-direction: row;
        border-right: none;
        border-top: 1px solid white;
      }

      .keypad-display {
        width: 60px;
        flex-shrink: 0;
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
        writing-mode: vertical-rl;
      }

      .keypad-grid {
        flex: 1;
        grid-template-rows: repeat(4, 1fr);
        grid-template-columns: repeat(3, 1fr);
        grid-auto-flow: row;
      }

      button { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="banner">
      <marquee behavior="alternate" direction="right"> PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! </marquee>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Left: keypad -->
    <div class="keypad-pane">
      <div class="keypad-display">
        <small>Activity</small>
        <b id="display-num" style="font-size:1.4rem">1</b>
      </div>
      <div class="keypad-grid">
        <button onclick="switchTo(7)">7</button>
        <button onclick="switchTo(8)">8</button>
        <button onclick="switchTo(9)" disabled>9</button>
        <button onclick="switchTo(4)">4</button>
        <button onclick="switchTo(5)">5</button>
        <button onclick="switchTo(6)">6</button>
        <button onclick="switchTo(1)" class="active">1</button>
        <button onclick="switchTo(2)">2</button>
        <button onclick="switchTo(3)">3</button>
        <button class="key-clear" onclick="switchTo(1)">clear</button>
        <a href="contents.html"><button class="key-dot">↩</button></a>
      </div>
    </div>

    <!-- Right: gallery -->
    <div class="gallery-pane">
      <div class="gallery-label" id="gallery-label"><b>Activity 1:</b> Unboxing...</div>
      <div class="gallery-scroll">

        <div class="gallery active" data-gallery="1" data-label="Unboxing...">
          <div class="tile" onclick="openLightbox(this)">
            <img src="w6/unboxing.jpg" alt="In our first week in the Telstra Creatorspace, we were introduced to Arduino boards and all the components in the kits we would be using over the next few weeks. We laid out everything from the box, and tried to guess the name and function of each part before going through them as a class. (needless to say, we didn't get many right... xD)">
          </div>
        </div>

        <div class="gallery" data-gallery="2" data-label="Blink!">
          <div class="tile" onclick="openLightbox(this)">
            <img src="w6/blink-03.jpg" alt="Blink 1">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="w6/blink-04.jpg" alt="Blink 2">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="w6/blink-05.jpg" alt="Blink 3">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="w6/blink-06.jpg" alt="Blink 4">
          </div>
        </div>

        <div class="gallery" data-gallery="3" data-label="Buzz!">
          <div class="tile" onclick="openLightbox(this)">
            <img src="w7/buzz-01.jpg" alt="Buzz 1">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="w7/buzz-02.jpg" alt="Buzz 2">
          </div>
        </div>

        <div class="gallery" data-gallery="4" data-label="Chindogu Build">
          <div class="tile" onclick="openLightbox(this)">
            <img src="w7/headphone-01.jpg" alt="Headphone 1">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="w7/headphone-02.jpg" alt="Headphone 2">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="w7/headphone.gif" alt="Headphone demo (modelled by Yours Truly)">
          </div>
        </div>

        <div class="gallery" data-gallery="5" data-label="Speculative Objects">
          <div class="tile" onclick="openLightbox(this)">
            <img src="w8/8x8.jpg" alt="Speculative Objects">
          </div>
        </div>

        <div class="gallery" data-gallery="6" data-label="Plant Piano">
          <div class="tile" onclick="openLightbox(this)">
            <img src="w8/plantpiano-01.jpg" alt="Plant Piano">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="w8/plantpiano-02.jpg" alt="Plant Piano (a closer look at the circuit)">
          </div>
        </div>

        <div class="gallery" data-gallery="7" data-label="Research">
          <div class="tile" onclick="openLightbox(this)">
            <img src="https://static.dezeen.com/uploads/2008/10/random-international-6.jpg" alt="'Audience' by Random International, 2008.">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1hY2n3eAl6mztWG17ESsK6E5R_WOvdtFI6g&s" alt="Smell of Data by Leanne Wijnsma and Froukje Tan, 2026.">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="https://ruggie.co/cdn/shop/files/3.png?v=1762563978&width=1445" alt="Ruggie® Alarm Clock 2.0 by Ruggie.co">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="https://s.yimg.com/ny/api/res/1.2/Cz2rQ1oy_jLjd7BhSFHCng--/YXBwaWQ9aGlnaGxhbmRlcjt3PTY0MDtoPTQzNQ--/http://globalfinance.zenfs.com/en_us/Finance/US_AHTTP_ENTREPRENEUR_H_NEW_LIVE/1417539279-smart-ballet-shoes-digitally-paint-dancers-fancy-footwork-e-traces-2.jpg" alt="E-Trace by Lesia Trubat Gonzalez: Smart ballet slippers that traces a dancer's movement and paints it into digital art.">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="https://www.studiointernational.com/images/articles/c/095-cohen-harold-2017/0500-Slide387-Turtle-Working.jpg" alt="Harry Cohen's drawing machine">
          </div>
        </div>

        <div class="gallery" data-gallery="8" data-label="Sketches">
          <div class="tile" onclick="openLightbox(this)">
            <img src="w8/sketch-01.jpg" alt="Concept sketches for Final Project">
          </div>
          <div class="tile" onclick="openLightbox(this)">
            <img src="w8/sketch-02.jpg" alt="User flow for Final Project">
          </div>
        </div>

        <div class="gallery" data-gallery="9" data-label="">
        </div>

      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-caption"></div>
  </div>

  <img id="staticgif" src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUybWdqZWt6NmVsbG94eTF1eTNtNm1tODlkZ3U3cjlkdmFuNHhkYndmcyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3ov9jUins0b1B8zUQ0/giphy.gif" alt="">

  <script>
    function switchTo(n) {
      document.querySelector('.gallery.active').classList.remove('active');
      const next = document.querySelector('[data-gallery="' + n + '"]');
      next.classList.add('active');
      document.querySelector('.keypad-grid button.active').classList.remove('active');
      document.querySelectorAll('.keypad-grid button')[([7,8,9,4,5,6,1,2,3]).indexOf(n)].classList.add('active');
      document.getElementById('gallery-label').innerHTML = '<b>Activity ' + n + ':</b> ' + next.dataset.label;
      document.getElementById('display-num').textContent = n;
    }

    function openLightbox(tile) {
      const img = tile.querySelector('img');
      if (!img) return;
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox-caption').textContent = img.alt;
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
</body>
</html>
