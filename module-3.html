<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 3: Physical Computing</title>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
  <style>
    body{
      background-color:rgb(255, 97, 155)
    }
    .header {
      outline: white;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      padding: 3em 8em;
    }
    .banner {
      position: relative;
      width: 100%;
      height: 2%;
      background-color: rgb(122, 140, 131);
      border: 2px solid black;
      border-radius: 20px;
      font-family: "Bitcount Single", monospace;
      font-optical-sizing: auto;
      font-weight: 300;
      font-style: normal;
      font-variation-settings:
        "slnt" 0,
        "CRSV" 0.5,
        "ELSH" 0,
        "ELXP" 0;
      font-size: 5em;
      display: flex;
      justify-content: center;
      align-items: center;
      color: black;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      padding: 5em;
      gap: 5em;
      size: 100px 100px;
      border-radius: 3em;
    }
    .gallery > *:hover {
      transform: scale(1.05);
      transition: transform 0.2s;
      cursor: pointer;
    }

    #staticgif {
      position: absolute;
      width: 15em;
      transform: translate(-50%, -50%);
      top: 70%;
      left: 10%;
    }

  </style>
</head>
<body>
  <div class="header">
    <div class="banner">
      <marquee behavior="alternate" direction="right"> PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! </marquee>
    </div>
  </div>

  <div class="gallery">
    <div class="gallery-item">
      <img src="w6/blink-01 Small.jpeg" alt="">
    </div>
    <div class="gallery-item">
      <img src="w6/blink-02 Small.jpeg" alt="">
    </div>
    <div class="gallery-item">
      <img src="w6/blink-03 Small.jpeg" alt="">
    </div>
    <div class="gallery-item">
      <img src="w6/blink-04 Small.jpeg" alt="">
    </div>
  </div>

  <div>
    <img id="staticgif" src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyYm9rd2x0ZzB1ZWx1ZmdveXY2Z240ZnZ5bGhlZzViZHJmYndpOTdlZSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/26tOYHUgZYoj2YKPe/200w.gif" alt="">
  </div>
</body>
</html>
