<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 3: Physical Computing</title>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
  <style>
    body{
      display: flex;
      background-color:rgb(255, 97, 155)
    }
    .header {
      outline: white;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      padding: 3em 8em;
    }
    .banner {
      position: relative;
      width: 100%;
      height: 2%;
      background-color: rgb(122, 140, 131);
      border: 2px solid black;
      border-radius: 20px;
      font-family: "Bitcount Single", monospace;
      font-optical-sizing: auto;
      font-weight: 300;
      font-style: normal;
      font-variation-settings:
        "slnt" 0,
        "CRSV" 0.5,
        "ELSH" 0,
        "ELXP" 0;
      font-size: 5em;
      display: flex;
      justify-content: center;
      align-items: center;
      color: black;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; display: flex; }

    .gallery-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #000;
      overflow: hidden;
    }
 
    .gallery-label {
      padding: 8px 12px;
      border-bottom: 1px solid #000;
      flex-shrink: 0;
    }
 
    .gallery-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
 
    .gallery-img {
      width: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery { display: none; flex-direction: column; gap: 8px; }
    .gallery.active { display: flex; }
 
    .tile {
      width: 100%;
      background: #ddd;
    }
 
    .fade-enter { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
 
    .keypad-pane {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
    }
 
    .keypad-display {
      border: 1px solid #000;
      padding: 8px 10px;
      text-align: right;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 6px;
    }
 
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      flex: 1;
    }
 
    button {
      border: 1px solid #000;
      background: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      user-select: none;
    }
 
    button:hover { background: #ffd2e6; }
 
    button.active {
      background: #000;
      color: rgb(255, 97, 155);
    }
 
    .key-clear {
      grid-column: span 2;
      aspect-ratio: auto;
      padding: 8px 0;
    }
 
    .key-dot { color: rgb(255, 97, 155); }

    #staticgif {
      position: absolute;
      width: 15em;
      transform: translate(-50%, -50%);
      top: 70%;
      left: 10%;
    }

  </style>
</head>
<body>
  <div class="header">
    <div class="banner">
      <marquee behavior="alternate" direction="right"> PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! PHYSICAL COMPUTING !!! </marquee>
    </div>
  </div>

  <div class="gallery-pane">
    <div class="gallery-label" id="gallery-label"><b>ACT_01:</b> Unboxing</div>
    <div class="gallery-scroll">
   
      <div class="gallery active" data-gallery="1" data-label="unboxing">
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:130px"></div>
        <div class="tile" style="height:180px"></div>
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:150px"></div>
        <div class="tile" style="height:170px"></div>
      </div>
   
      <div class="gallery" data-gallery="2" data-label="buzz">
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:170px"></div>
        <div class="tile" style="height:150px"></div>
        <div class="tile" style="height:130px"></div>
        <div class="tile" style="height:180px"></div>
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:160px"></div>
      </div>
   
      <div class="gallery" data-gallery="3" data-label="Portraits">
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:180px"></div>
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:150px"></div>
      </div>
   
      <div class="gallery" data-gallery="4" data-label="Abstract">
        <div class="tile" style="height:150px"></div>
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:170px"></div>
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:130px"></div>
        <div class="tile" style="height:180px"></div>
        <div class="tile" style="height:140px"></div>
      </div>
   
      <div class="gallery" data-gallery="5" data-label="Food">
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:150px"></div>
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:170px"></div>
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:130px"></div>
        <div class="tile" style="height:180px"></div>
      </div>
   
      <div class="gallery" data-gallery="6" data-label="Travel">
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:170px"></div>
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:150px"></div>
        <div class="tile" style="height:180px"></div>
        <div class="tile" style="height:130px"></div>
        <div class="tile" style="height:160px"></div>
      </div>
   
      <div class="gallery" data-gallery="7" data-label="Animals">
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:170px"></div>
        <div class="tile" style="height:150px"></div>
        <div class="tile" style="height:130px"></div>
        <div class="tile" style="height:180px"></div>
        <div class="tile" style="height:150px"></div>
      </div>
   
      <div class="gallery" data-gallery="8" data-label="Street">
        <div class="tile" style="height:150px"></div>
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:170px"></div>
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:150px"></div>
        <div class="tile" style="height:130px"></div>
      </div>
   
      <div class="gallery" data-gallery="9" data-label="Minimal">
        <div class="tile" style="height:170px"></div>
        <div class="tile" style="height:140px"></div>
        <div class="tile" style="height:160px"></div>
        <div class="tile" style="height:150px"></div>
        <div class="tile" style="height:180px"></div>
        <div class="tile" style="height:130px"></div>
        <div class="tile" style="height:160px"></div>
      </div>
   
    </div>
  </div>
   
  <div class="keypad-pane">
    <div class="keypad-display">
      <small>gallery</small>
      <b id="display-num" style="font-size:1.4rem">1</b>
    </div>
    <div class="keypad-grid">
      <button onclick="switchTo(7)">7</button>
      <button onclick="switchTo(8)">8</button>
      <button onclick="switchTo(9)">9</button>
      <button onclick="switchTo(4)">4</button>
      <button onclick="switchTo(5)">5</button>
      <button onclick="switchTo(6)">6</button>
      <button onclick="switchTo(1)" class="active">1</button>
      <button onclick="switchTo(2)">2</button>
      <button onclick="switchTo(3)">3</button>
      <button class="key-clear" onclick="switchTo(1)">clear</button>
      <button class="key-dot" disabled>·</button>
    </div>
  </div>

    <img id="staticgif" src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyYm9rd2x0ZzB1ZWx1ZmdveXY2Z240ZnZ5bGhlZzViZHJmYndpOTdlZSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/26tOYHUgZYoj2YKPe/200w.gif" alt="">
  </div>

  <script>
    function switchTo(n) {
      document.querySelector('.gallery.active').classList.remove('active');
      document.querySelector('[data-gallery="' + n + '"]').classList.add('active');
      document.querySelector('.keypad-grid button.active').classList.remove('active');
      document.querySelectorAll('.keypad-grid button')[([7,8,9,4,5,6,1,2,3]).indexOf(n)].classList.add('active');
      const label = document.querySelector('[data-gallery="' + n + '"]').dataset.label;
      document.getElementById('gallery-label').innerHTML = '<b>Gallery ' + n + '</b> — ' + label;
      document.getElementById('display-num').textContent = n;
      document.querySelector('.gallery-scroll').scrollTop = 0;
    }
  </script>
</body>
</html>
