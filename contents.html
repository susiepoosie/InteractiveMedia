<!DOCTYPE html>
<html>
<head>
    <title>Contents of student's bag</title>
    <style>
        div {
            display: block;
            unicode-bidi: isolate;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-image: url(media/contents-bg.jpg)
        }
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            /* You can set this to whatever you wish. */
            width: 100%;
            
            /* You'll need to set a height. */
            height: 100%;
            
            /* Allows positioning relative to this container. */
            position: relative;
        }
        img{
            height: 300px;
        }
        .wrapper {
            position: absolute;
            width: 100vw;
            height: 94vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .draggable{
            position: absolute;
            cursor: move;
            display: flex;
            flex-direction: column;
        }
        #laptop{
            top: 50vh;
            left: 10vw;

        }
        #black{
            top: 30vh;
            left: 40vw;
        }
        #calculator{
            top: 50px;
            left: 80vw;
        }
        #bottle{
            top: 80px;
            left: 10vw;
        }
        #white{
            top: 60vh;
            left: 70vw;
        }
        #pencilcase{
            top: 100px;
            left: 30vw;
        }
        #face{
            top: 80vh;
            left: 60vw;
        }
    </style>
</head>
<body>
    <a href="index.html">I'm done, let's put everything back...</a>
    <div class="wrapper">
        <div class="draggable" id="laptop">
            <img src="media/laptop.png" alt="laptop">
            <a href="desktop.html">Module 1</a>
        </div>
        <div class="draggable" id="calculator">
            <img src="media/calculator.png" alt="calculator">
            <a href="week-1.html">Module 3</a>
        </div>
        <div class="draggable" id="black">
            <img src="media/notebook_black.png" alt="black">
            <a href="week-2.html">Module 2</a>
        </div>
    </div>
    <div class="draggable" id="bottle">
        <img src="media/bottle.png" alt="bottle">
    </div>
    <div class="draggable" id="pencilcase">
        <img src="media/pencil-case.png" alt="pencilcase">
    </div>
    <div class="draggable" id="white">
        <img src="media/notebook_whitr.png" alt="white notebook">
    </div>
    <div class="draggable" id="face">
        <img src="media/face.png" alt="Reusable shopping bag">
    </div>

    <script>
        // Get all the elements with class name "draggable":
        var draggableElements = document.getElementsByClassName("draggable");
        
        // Apply dragElement function to each draggable element:
        for (var i = 0; i < draggableElements.length; i++) {
        dragElement(draggableElements[i]);
        }
        
        function dragElement(elmnt) {
        var pos1 = 0,
            pos2 = 0,
            pos3 = 0,
            pos4 = 0;
        if (elmnt.getElementsByClassName(elmnt.className)[0]) {
            elmnt.getElementsByClassName(elmnt.className)[0].onmousedown =
            dragMouseDown;
        } else {
            // move the DIV from anywhere inside the DIV:
            elmnt.onmousedown = dragMouseDown;
        }
        
        function dragMouseDown(e) {
            e = e || window.event;
            e.preventDefault();
            // get the mouse cursor position at startup:
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            // call a function whenever the cursor moves:
            document.onmousemove = elementDrag;
        }
        
        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            // calculate the new cursor position:
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            // set the element's new position:
            elmnt.style.top = elmnt.offsetTop - pos2 + "px";
            elmnt.style.left = elmnt.offsetLeft - pos1 + "px";
        }
        
        function closeDragElement() {
            // stop moving when mouse button is released:
            document.onmouseup = null;
            document.onmousemove = null;
        }
        }
    </script>
</body>
</html>
